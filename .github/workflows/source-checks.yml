name: Image integration source checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Check storage adapter and snapshot CLI contracts
        run: node --test tests/*.test.mjs
      - name: Check same-run peer recovery binding
        run: python3 -B -m unittest discover -s tests/immich

  immich-restore:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the pinned Immich release into a new private instance
        run: python3 -B tests/immich/recover.py
      - name: Retain bounded recovery status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immich-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/immich-restore-result.json
          if-no-files-found: error
          retention-days: 7
